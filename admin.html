<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Administración | FIREWORKS ZD</title>
<link rel="stylesheet" href="css/style.css"></head>
<body><main class="admin">
<h1>Administración</h1><p id="msg" role="status" class="note"></p>
<section id="login"><form id="fl"><label for="em">Correo</label><input id="em" type="email" required autocomplete="username"><label for="pw">Contraseña</label><input id="pw" type="password" required autocomplete="current-password"><button class="btn" style="margin-top:16px">Entrar</button></form></section>
<div id="panel" hidden>
<button class="btn ghost" id="salir">Cerrar sesión</button>
<section><h2>Productos</h2>
<form id="fp"><div class="row">
<div><label for="nombre">Nombre</label><input id="nombre" required></div>
<div><label for="pc">Precio x caja (S/)</label><input id="pc" type="number" step="0.01" min="0"></div>
<div><label for="pd">Precio x docena (S/)</label><input id="pd" type="number" step="0.01" min="0"></div>
<div><label for="pu">Precio x unidad (S/)</label><input id="pu" type="number" step="0.01" min="0"></div></div>
<div class="row"><div><label for="f1">Foto 1</label><input id="f1" type="file" accept="image/*"></div>
<div><label for="f2">Foto 2</label><input id="f2" type="file" accept="image/*"></div>
<div><label for="ord">Orden (1, 2, 3…)</label><input id="ord" type="number" value="0"></div>
<div><label><input id="vis" type="checkbox" checked style="width:auto"> Visible en la página</label></div></div>
<button class="btn" id="gp">Guardar producto</button> <button class="btn ghost" type="button" id="nuevo">Limpiar</button></form>
<div id="lista"></div></section>
<section><h2>Textos de la página</h2><p class="note">Deja vacío un campo para mantener el texto actual de la página.</p><form id="ft"></form></section>
</div></main>
<script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
